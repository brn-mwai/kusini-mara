<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forecast Issues — Cascade Bridge</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="assets/console.css">
<style>
.card-ghost { border-style: dashed; opacity: 0.55; align-items: center; justify-content: center; min-height: 220px; display: flex; flex-direction: column; gap: 8px; color: var(--text-dim); }
.issue-thumb { width: 100%; height: 100%; padding: 10px; }
.detail-grid { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; font-size: 12.5px; }
.detail-grid dt { color: var(--text-dim); }
.detail-grid dd { font-family: var(--mono); font-variant-numeric: tabular-nums; word-break: break-all; }
</style>
</head>
<body>
<nav class="rail" id="rail"></nav>
<main class="console">
  <header class="band band-1">
    <span class="page-title">Maps</span>
    <span class="vsep"></span>
    <nav class="tabs">
      <a class="tab" href="maps.html">Layer Explorer</a>
      <a class="tab active" href="maps-issues.html">Forecast Issues</a>
      <a class="tab" id="tab-saved" href="maps-issues.html">Saved Views</a>
    </nav>
    <span class="grow"></span>
    <button class="btn btn-teal" id="btn-new-view"></button>
  </header>
  <div class="band band-2">
    <label class="search" id="search-box"></label>
    <button class="btn btn-icon" id="btn-filter" title="Filter"></button>
    <div class="segmented" id="view-toggle"></div>
    <button class="btn btn-icon btn-ghost" id="btn-overflow" title="More"></button>
  </div>
  <div class="band band-3">
    <div id="filter-chips" style="display:flex;gap:8px;align-items:center;overflow-x:auto"></div>
    <span class="grow" style="flex:1"></span>
    <span class="kbd-hint" id="sort-ind"></span>
  </div>
  <section class="band band-4" id="band-4" style="overflow-y:auto"></section>
</main>

<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/echarts.min.js"></script>
<script src="assets/data.js"></script>
<script src="assets/format.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/components.js"></script>
<script src="assets/map.js"></script>
<script>
(() => {
  const D = CB_DATA, F = CB.fmt, S = CB.state
  CB.shell.init({ page: 'maps' })

  const PROB_LAYER = D.layers.find(l => l.id === 'prob')
  const FILTERS = [['all', 'All issues'], ['published', 'Published'], ['verified', 'Verified'], ['superseded', 'Superseded']]
  const st = {
    view: S.get('view') === 'list' ? 'list' : 'grid',
    filter: ['published', 'verified', 'superseded'].includes(S.get('filter')) ? S.get('filter') : 'all',
    forced: ['empty', 'loading'].includes(S.get('state')) ? S.get('state') : null,
    query: '',
  }
  const issues = () => Object.values(D.issues)
    .filter(i => st.filter === 'all' || i.status === st.filter)
    .filter(i => !st.query || i.id.includes(st.query) || i.status.includes(st.query))
    .sort((a, b) => b.id.localeCompare(a.id))

  const statusFilter = new Set()
  document.getElementById('btn-new-view').innerHTML = CB.icon('plus') + 'New view'
  document.getElementById('btn-new-view').addEventListener('click', () => { location.href = 'maps.html' })
  document.getElementById('tab-saved').addEventListener('click', e => { e.preventDefault(); CB.toast('Saved views live on the Layer Explorer tab') })
  document.getElementById('btn-filter').innerHTML = CB.icon('filter')
  document.getElementById('btn-filter').addEventListener('click', e => {
    CB.filterMenu(e.currentTarget, {
      title: 'Status',
      options: [['published', 'Published'], ['verified', 'Verified'], ['superseded', 'Superseded']],
      selected: statusFilter,
      onChange: sel => {
        st.filter = sel.size === 1 ? [...sel][0] : 'all'
        S.set({ filter: st.filter === 'all' ? null : st.filter })
        document.getElementById('btn-filter').classList.toggle('filter-on', sel.size > 0)
        renderChips(); renderMain()
      },
    })
  })
  document.getElementById('btn-overflow').innerHTML = CB.icon('more')
  document.getElementById('btn-overflow').addEventListener('click', e => {
    CB.menu(e.currentTarget, [
      { icon: 'copy', label: 'Copy link to view', action: CB.copyLink },
      { icon: 'download', label: 'Export issue list CSV', action: () => {
        const rows = [['issue', 'status', 'init_date', 'source', 'members', 'reduction', 'label_version', 'brier', 'feature_coverage'],
          ...issues().map(i => [i.id, i.status, i.initDate, i.run.source, i.run.ensembleMembers, i.run.ensembleReduction, i.run.labelVersion, i.verification ? i.verification.brier : '', i.run.featureCoverage])]
        CB.download('issues.csv', CB.csv(rows), 'text/csv')
      } },
      { icon: 'printer', label: 'Print', action: () => window.print() },
    ])
  })
  document.getElementById('search-box').innerHTML =
    CB.icon('search') + '<input id="search-input" type="search" placeholder="Search issue">'
  document.getElementById('search-input').addEventListener('input', e => {
    st.query = e.target.value.trim().toLowerCase()
    renderMain()
  })
  document.getElementById('sort-ind').innerHTML = 'Date ' + CB.icon('down', 'sm')

  function renderToggle() {
    const host = document.getElementById('view-toggle')
    host.innerHTML = `
      <button data-v="list" class="${st.view === 'list' ? 'active' : ''}">${CB.icon('list', 'sm')}List</button>
      <button data-v="grid" class="${st.view === 'grid' ? 'active' : ''}">${CB.icon('grid', 'sm')}Grid</button>`
    host.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
      st.view = b.dataset.v
      S.set({ view: st.view === 'grid' ? null : st.view })
      renderToggle(); renderMain()
    }))
  }

  function renderChips() {
    const host = document.getElementById('filter-chips')
    host.innerHTML = FILTERS.map(([id, label]) =>
      `<button class="pill-btn${id === st.filter ? ' active' : ''}" data-f="${id}" style="height:30px">${label}</button>`).join('')
    host.querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => {
      st.filter = b.dataset.f
      S.set({ filter: st.filter === 'all' ? null : st.filter })
      renderChips(); renderMain()
    }))
  }

  /* countyPath normalises each shape into its own square, so place each at its
     real centroid and scale it by its real extent to read as Kenya */
  const LON = [33.9, 42.0], LAT = [-3.1, 5.6]
  function issueThumb(issue) {
    const firstMonth = Math.min(...issue.forecasts.map(f => f.validMonth))
    const W = 280, H = 150
    const maxSpan = Math.max(...D.counties.map(c => Math.max(c.bbox[2] - c.bbox[0], c.bbox[3] - c.bbox[1])))
    let paths = ''
    for (const c of D.counties) {
      const f = issue.forecasts.find(x => x.countyId === c.id && x.validMonth === firstMonth)
      const color = c.hasModelCoverage && f
        ? CB.ui.rampColor(PROB_LAYER, f.droughtProb)
        : getComputedStyle(document.documentElement).getPropertyValue('--nocov').trim()
      const span = Math.max(c.bbox[2] - c.bbox[0], c.bbox[3] - c.bbox[1])
      const box = (span / maxSpan) * 118
      const cx = ((c.centroid[0] - LON[0]) / (LON[1] - LON[0])) * W
      const cy = ((LAT[1] - c.centroid[1]) / (LAT[1] - LAT[0])) * H
      paths += `<path d="${CB.ui.countyPath(c.id, box)}" fill="${color}" fill-opacity="0.72" stroke="${color}" stroke-width="0.6"
        transform="translate(${(cx - box / 2).toFixed(1)} ${(cy - box / 2).toFixed(1)})"/>`
    }
    return `<svg class="issue-thumb" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${paths}</svg>`
  }

  function footFor(issue) {
    if (issue.verification) {
      return `${CB.icon('check', 'sm')}<span>Verified · Brier <span class="num">${F.prob(issue.verification.brier)}</span></span>`
    }
    const lastMonth = Math.max(...issue.forecasts.map(f => f.validMonth))
    return `${CB.icon('calendar', 'sm')}<span>Awaiting truth · <span class="num">${F.MONTHS[lastMonth - 1]} ${issue.forecasts[0].validYear}</span></span>`
  }

  function cardHtml(issue) {
    return `<button class="card" data-issue="${issue.id}">
      <span class="card-thumb">${issueThumb(issue)}
        <span class="card-hover">
          <span class="btn btn-icon" style="height:26px;width:26px">${CB.icon('external', 'sm')}</span>
          <span class="btn btn-icon" style="height:26px;width:26px">${CB.icon('more', 'sm')}</span>
        </span>
      </span>
      <span class="card-body">
        <span class="card-title-row">
          <span class="dot" style="background:var(--teal)"></span>
          <b>Issue ${issue.id}</b>
          <span class="when num">init ${issue.initDate}</span>
        </span>
        <span class="chip-row">
          <span class="chip">${CB.esc(issue.run.source)} · ${issue.run.ensembleMembers} members</span>
          <span class="chip">Lead 1–3</span>
          <span class="chip num">${issue.run.ensembleReduction}</span>
          <span class="chip num">thr ${issue.config.threshold}</span>
        </span>
      </span>
      <span class="card-foot">${footFor(issue)}</span>
    </button>`
  }

  function listHtml(items) {
    const rows = items.map(i => `<tr data-issue="${i.id}">
      <td class="num">${i.id}</td>
      <td>${CB.ui.signalPill(i.status === 'verified' ? 'normal' : i.status === 'published' ? 'watch' : 'no_coverage').replace(/>(Normal|Watch|No coverage)</, '>' + i.status + '<')}</td>
      <td class="num">${i.initDate}</td>
      <td>${CB.esc(i.run.source)}</td>
      <td class="r num">${i.run.ensembleMembers}</td>
      <td class="num">${i.run.ensembleReduction}</td>
      <td class="num">${i.run.labelVersion}</td>
      <td class="r num">${i.verification ? F.prob(i.verification.brier) : '?'}</td>
      <td class="r num">${Math.round(i.run.featureCoverage * 100)}%</td>
    </tr>`).join('')
    return `<div class="table-wrap"><table class="data"><thead><tr>
      <th>Issue</th><th>Status</th><th>Init date</th><th>Source</th><th class="r">Members</th>
      <th>Reduction</th><th>Labels</th><th class="r">Brier</th><th class="r">Coverage</th>
    </tr></thead><tbody>${rows}</tbody></table></div>`
  }

  function openDetail(issueId) {
    const issue = D.issues[issueId]
    const v = issue.verification
    const body = CB.el(`<div>
      <div class="detail-flags" style="margin-bottom:12px">
        ${CB.ui.signalPill(v ? 'normal' : 'watch').replace(/>(Normal|Watch)</, '>' + issue.status + '<')}
        <span class="issue-ref">${CB.icon('calendar', 'sm')}init <span class="num">${issue.initDate}</span></span>
        <span class="issue-ref">generated <span class="num">${issue.generatedAt}</span></span>
      </div>
      <dl class="detail-grid">
        <dt>Content hash</dt><dd>${issue.contentHash}</dd>
        <dt>Source</dt><dd>${CB.esc(issue.run.source)}</dd>
        <dt>Members</dt><dd>${issue.run.ensembleMembers} · ${issue.run.ensembleReduction}</dd>
        <dt>Forecast GRIB</dt><dd>${CB.esc(issue.run.forecastGrib)}</dd>
        <dt>Climatology GRIB</dt><dd>${CB.esc(issue.run.climatologyGrib)}</dd>
        <dt>Code commit</dt><dd>${issue.run.codeCommit}</dd>
        <dt>Drought model</dt><dd>${CB.esc(issue.run.droughtModel)}</dd>
        <dt>Bridge model</dt><dd>${CB.esc(issue.run.bridgeModel)}</dd>
        <dt>Label version</dt><dd>${issue.run.labelVersion}</dd>
        <dt>Feature coverage</dt><dd>${Math.round(issue.run.featureCoverage * 100)}% real inputs</dd>
        <dt>Threshold</dt><dd>${issue.config.threshold}</dd>
      </dl>
      <p style="color:var(--text-dim);font-size:12px;margin:10px 0 14px">${CB.esc(issue.config.thresholdRationale)}</p>
      ${v ? `<div class="panel" style="padding:12px;margin-bottom:14px">
        <div class="chart-title" style="margin-bottom:8px"><span>Verification · ${CB.esc(v.truthSource)}</span><span class="num">${v.verifiedAt.slice(0, 10)}</span></div>
        <div style="display:flex;gap:16px;flex-wrap:wrap" class="num">
          <span>Brier <b>${F.prob(v.brier)}</b></span><span>BSS <b>${F.prob(v.brierSkillScore)}</b></span>
          <span>ROC AUC <b>${v.rocAuc}</b></span><span>${v.hits} hits</span><span>${v.misses} miss</span>
          <span>${v.falseAlarms} false alarm</span><span>${v.correctNegatives} correct neg</span>
        </div></div>` : `<div class="panel" style="padding:12px;margin-bottom:14px;color:var(--text-dim)">Verification pending — truth arrives with the VCI3M composite after the last valid month.</div>`}
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" data-dl="json">${CB.icon('download', 'sm')}JSON</button>
        <button class="btn" data-dl="csv">${CB.icon('download', 'sm')}CSV</button>
        <button class="btn" data-dl="cap">${CB.icon('download', 'sm')}CAP 1.2</button>
        <button class="btn" data-dl="netcdf">${CB.icon('external', 'sm')}NetCDF</button>
        <button class="btn" data-dl="geotiff">${CB.icon('external', 'sm')}GeoTIFF</button>
      </div>
    </div>`)
    body.querySelectorAll('[data-dl]').forEach(b =>
      b.addEventListener('click', () => {
        const kind = b.dataset.dl
        if (kind === 'json') CB.download(`issue-${issue.id}.json`, JSON.stringify(issue, null, 2), 'application/json')
        else if (kind === 'csv') {
          const rows = [['county', 'valid_year', 'valid_month', 'lead_months', 'prob', 'p10', 'p90', 'members_above', 'members_total', 'signal'],
            ...issue.forecasts.map(f => [f.countyId, f.validYear, f.validMonth, f.leadMonths, f.droughtProb, f.probP10, f.probP90, f.membersAboveThreshold, f.membersTotal, f.signal])]
          CB.download(`issue-${issue.id}-forecasts.csv`, CB.csv(rows), 'text/csv')
        } else if (kind === 'cap') CB.download(`issue-${issue.id}.cap.xml`, capForIssue(issue), 'application/xml')
        else CB.toast('Binary raster formats ship with the real API')
      }))
    CB.ui.dialog({ title: 'Issue ' + issue.id + ' — immutable record', body, wide: true })
  }

  function capForIssue(issue) {
    const firstMonth = Math.min(...issue.forecasts.map(f => f.validMonth))
    const infos = issue.forecasts
      .filter(f => f.validMonth === firstMonth && (f.signal === 'watch' || f.signal === 'drought'))
      .map(f => {
        const c = D.counties.find(x => x.id === f.countyId)
        return `  <info>
    <category>Met</category>
    <event>Drought ${f.signal === 'drought' ? 'warning' : 'watch'}, valid ${F.MONTHS[f.validMonth - 1]} ${f.validYear}</event>
    <urgency>Expected</urgency>
    <severity>${f.signal === 'drought' ? 'Extreme' : 'Moderate'}</severity>
    <certainty>Likely</certainty>
    <parameter><valueName>probability</valueName><value>${f.droughtProb}</value></parameter>
    <parameter><valueName>issue</valueName><value>${issue.id}</value></parameter>
    <area><areaDesc>${c.name} County, Kenya</areaDesc></area>
  </info>`
      }).join('\n')
    return `<?xml version="1.0" encoding="UTF-8"?>
<alert xmlns="urn:oasis:names:tc:emergency:cap:1.2">
  <identifier>cb-issue-${issue.id}</identifier>
  <sender>alerts@cascadebridge.example</sender>
  <sent>${issue.generatedAt}</sent>
  <status>Actual</status>
  <msgType>Alert</msgType>
  <scope>Public</scope>
${infos}
</alert>`
  }

  function renderMain() {
    const b4 = document.getElementById('band-4')
    if (st.forced === 'loading') {
      b4.innerHTML = `<div class="cards">${'<div class="skel" style="height:250px"></div>'.repeat(3)}</div>`
      return
    }
    const items = st.forced === 'empty' ? [] : issues()
    if (!items.length) {
      b4.innerHTML = `<div style="flex:1;display:flex;align-items:center;justify-content:center">
        ${CB.ui.emptyState({ icon: 'maps', title: 'No issues match', body: st.forced === 'empty' ? 'Forecast issues appear here each month after the model run publishes.' : 'No issue has that status. Clear the filter to see all issues.' })}</div>`
      return
    }
    if (st.view === 'list') {
      b4.innerHTML = listHtml(items)
      b4.querySelectorAll('tr[data-issue]').forEach(tr =>
        tr.addEventListener('click', () => openDetail(tr.dataset.issue)))
      return
    }
    b4.innerHTML = `<div class="cards">${items.map(cardHtml).join('')}
      <div class="card card-ghost">${CB.icon('plus')}<span>Next issue expected Sep 2026</span></div></div>`
    b4.querySelectorAll('[data-issue]').forEach(card => {
      const id = card.dataset.issue
      card.addEventListener('click', () => openDetail(id))
      const [ext, more] = card.querySelectorAll('.card-hover .btn')
      ext?.addEventListener('click', e => { e.stopPropagation(); location.href = 'maps.html?issue=' + id })
      more?.addEventListener('click', e => {
        e.stopPropagation()
        CB.menu(more, [
          { icon: 'external', label: 'Open in Layer Explorer', action: () => { location.href = 'maps.html?issue=' + id } },
          { icon: 'download', label: 'Download JSON', action: () => CB.download(`issue-${id}.json`, JSON.stringify(D.issues[id], null, 2), 'application/json') },
          { icon: 'copy', label: 'Copy link', action: CB.copyLink },
        ])
      })
    })
  }

  renderToggle()
  renderChips()
  renderMain()
})()
</script>
</body>
</html>
