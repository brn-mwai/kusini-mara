<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Settings — Cascade Bridge</title>
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="assets/console.css">
<style>
.settings-body { flex: 1; min-width: 0; overflow-y: auto; padding: 18px; }
.settings-section { max-width: 860px; display: flex; flex-direction: column; gap: 14px; }
.settings-section h2 { font-size: 15px; font-weight: 650; }
.settings-section .lede { color: var(--text-dim); font-size: 12.5px; max-width: 560px; }
.source-row { display: flex; align-items: center; gap: 14px; padding: 12px 14px; }
.source-row .src-meta { flex: 1; min-width: 0; }
.source-row .src-meta .s-name { font-weight: 600; }
.source-row .src-meta .s-endpoint { color: var(--text-faint); font-size: 11px; }
.source-row .src-clock { width: 220px; flex: none; }
</style>
</head>
<body>
<nav class="rail" id="rail"></nav>
<main class="console">
  <header class="band band-1">
    <span class="page-title">Settings</span>
    <span class="vsep"></span>
    <span class="kbd-hint" id="org-line"></span>
    <span class="grow"></span>
    <button class="btn btn-teal" id="btn-primary"></button>
  </header>
  <div class="band band-2">
    <label class="search" id="search-box"></label>
    <button class="btn btn-icon btn-ghost" id="btn-overflow" title="More"></button>
  </div>
  <section class="band band-4" id="band-4">
    <nav class="settings-nav" id="settings-nav"></nav>
    <div class="settings-body" id="settings-body"></div>
  </section>
</main>

<script src="vendor/maplibre-gl.js"></script>
<script src="assets/data.js"></script>
<script src="assets/format.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/charts.js"></script>
<script src="assets/components.js"></script>
<script src="assets/map.js"></script>
<script>
(() => {
  const D = CB_DATA.settings, F = CB.fmt, S = CB.state
  CB.shell.init({ page: 'settings' })

  const TABS = [
    ['org', 'Organisation', 'counties'],
    ['members', 'Members', 'reports'],
    ['keys', 'API keys', 'sliders'],
    ['sources', 'Data sources', 'stations'],
    ['export', 'Export', 'external'],
  ]
  const st = {
    tab: TABS.some(([id]) => id === S.get('tab')) ? S.get('tab') : 'org',
    forced: ['empty', 'loading'].includes(S.get('state')) ? S.get('state') : null,
    query: '',
  }

  document.getElementById('btn-primary').innerHTML = CB.icon('plus') + 'Invite member'
  document.getElementById('btn-primary').addEventListener('click', () => CB.toast('Invites are not wired in this prototype'))
  document.getElementById('btn-overflow').innerHTML = CB.icon('more')
  document.getElementById('btn-overflow').addEventListener('click', () => CB.toast('Not wired in this prototype'))
  document.getElementById('search-box').innerHTML =
    CB.icon('search') + '<input id="search-input" type="search" placeholder="Search settings">'
  document.getElementById('search-input').addEventListener('input', e => {
    st.query = e.target.value.trim().toLowerCase()
    renderBody()
  })
  document.getElementById('org-line').textContent = D.organisation.name

  function renderNav() {
    const host = document.getElementById('settings-nav')
    host.innerHTML = TABS.map(([id, label, icon]) =>
      `<button data-tab="${id}" class="${id === st.tab ? 'active' : ''}">${CB.icon(icon)}<span>${label}</span></button>`).join('')
    host.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', () => {
      st.tab = b.dataset.tab
      S.set({ tab: st.tab === 'org' ? null : st.tab })
      renderNav(); renderBody()
    }))
  }

  const matches = s => !st.query || s.toLowerCase().includes(st.query)
  const fmtTs = ts => ts ? ts.slice(0, 16).replace('T', ' ') : F.DASH

  function orgHtml() {
    const o = D.organisation
    const row = (label, value, mono) => `<div class="form-row"><label>${label}</label>
      <input readonly value="${CB.esc(String(value))}" ${mono ? 'class="num"' : ''}></div>`
    return `<div class="settings-section">
      <h2>Organisation</h2>
      <p class="lede">Pilot deployment scope. Reads are tenant-scoped server side in the real system; this prototype shows the NDMA pilot tenant.</p>
      ${row('Name', o.name)}${row('Tenant id', o.tenantId, 1)}${row('Region', o.region)}
      ${row('Plan', o.plan)}${row('Seats', o.seats, 1)}
      ${row('Counties covered by the model', o.countiesCovered + ' of ' + o.countiesTotal, 1)}
    </div>`
  }

  function membersHtml() {
    const rows = D.members.filter(m => matches(m.name + m.email + m.role)).map(m => `<tr>
      <td><span style="display:inline-flex;align-items:center;gap:9px">${CB.ui.avatarDisc(m.name)}${CB.esc(m.name)}</span></td>
      <td class="num" style="color:var(--text-dim)">${CB.esc(m.email)}</td>
      <td>${CB.esc(m.role)}</td>
      <td class="num">${fmtTs(m.lastActiveAt)}</td>
    </tr>`).join('')
    return `<div class="settings-section"><h2>Members</h2>
      ${rows ? `<div class="panel" style="overflow:hidden"><table class="data">
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Last active</th></tr></thead>
        <tbody>${rows}</tbody></table></div>`
        : CB.ui.emptyState({ icon: 'reports', title: 'No members match', body: 'Clear the search to see all members.' })}
    </div>`
  }

  function keysHtml() {
    const rows = D.apiKeys.filter(k => matches(k.label + k.prefix)).map(k => `<tr>
      <td>${CB.esc(k.label)}</td>
      <td class="num">${CB.esc(k.prefix)}…</td>
      <td>${k.scopes.map(s => `<span class="chip" style="height:22px;font-size:10px;padding:0 8px">${CB.esc(s)}</span>`).join(' ')}</td>
      <td class="r num">${k.rateLimitRpm} rpm</td>
      <td class="num">${k.createdAt}</td>
      <td class="num">${fmtTs(k.lastUsedAt)}</td>
      <td><button class="btn btn-ghost" data-reveal>Reveal</button></td>
    </tr>`).join('')
    return `<div class="settings-section"><h2>API keys</h2>
      <p class="lede">Ingest and read keys for the station network and public dashboards. Rate limits are enforced per key.</p>
      ${rows ? `<div class="panel" style="overflow:auto"><table class="data">
        <thead><tr><th>Label</th><th>Prefix</th><th>Scopes</th><th class="r">Rate limit</th><th>Created</th><th>Last used</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table></div>`
        : CB.ui.emptyState({ icon: 'sliders', title: 'No keys match', body: 'Clear the search to see all keys.' })}
      <div><button class="btn btn-teal" id="btn-new-key">${CB.icon('plus')}Create key</button></div>
    </div>`
  }

  function sourcesHtml() {
    const rows = D.sources.filter(s => matches(s.name + s.kind)).map(s => {
      const pct = Math.min(100, Math.round((s.freshnessHours / s.staleAfterHours) * 100))
      return `<div class="panel source-row">
        <span class="src-meta">
          <div class="s-name">${CB.esc(s.name)} <span class="chip" style="height:20px;font-size:10px;padding:0 8px;margin-left:6px">${CB.esc(s.kind)}</span></div>
          <div class="s-endpoint num">${CB.esc(s.endpoint)} · last ingest ${fmtTs(s.lastIngestAt)}</div>
        </span>
        <span class="src-clock">${CB.ui.progress({ label: s.freshnessHours + ' h', pct })}</span>
        ${CB.ui.signalPill(s.status === 'ok' ? 'normal' : 'watch').replace('>Normal<', '>ok<').replace('>Watch<', '>stale<')}
      </div>`
    }).join('')
    return `<div class="settings-section"><h2>Data sources</h2>
      <p class="lede">Ingest freshness against each source's staleness allowance. A stale source zero-fills features and lowers the run's feature coverage — the Scorecard's Data Health tab shows the effect.</p>
      ${rows || CB.ui.emptyState({ icon: 'stations', title: 'No sources match', body: 'Clear the search to see all sources.' })}
    </div>`
  }

  function exportHtml() {
    const rows = D.export.schedules.filter(s => matches(s.format + s.target)).map(s => `<tr data-exp="${s.id}">
      <td>${CB.esc(s.format)}</td>
      <td class="num" style="color:var(--text-dim)">${CB.esc(s.target)}</td>
      <td>${CB.esc(s.cadence)}</td>
      <td class="num">${fmtTs(s.lastRunAt)}</td>
      <td><button class="toggle${s.enabled ? ' on' : ''}" data-toggle="${s.id}" aria-label="Toggle"></button></td>
    </tr>`).join('')
    return `<div class="settings-section"><h2>Export</h2>
      <p class="lede">Scheduled delivery of each published issue as NetCDF, GeoTIFF and CAP to the tenant's nominated targets.</p>
      ${rows ? `<div class="panel" style="overflow:auto"><table class="data">
        <thead><tr><th>Format</th><th>Target</th><th>Cadence</th><th>Last run</th><th></th></tr></thead>
        <tbody>${rows}</tbody></table></div>`
        : CB.ui.emptyState({ icon: 'external', title: 'No schedules match', body: 'Clear the search to see all schedules.' })}
    </div>`
  }

  function renderBody() {
    const host = document.getElementById('settings-body')
    if (st.forced === 'loading') { host.innerHTML = CB.ui.skelBlock(28) + '<div style="height:12px"></div>' + CB.ui.skelRows(5, 22); return }
    if (st.forced === 'empty') {
      host.innerHTML = CB.ui.emptyState({ icon: 'settings', title: 'Nothing configured yet', body: 'Organisation, members, keys, sources and export schedules appear here once provisioning completes.' })
      return
    }
    host.innerHTML = { org: orgHtml, members: membersHtml, keys: keysHtml, sources: sourcesHtml, export: exportHtml }[st.tab]()
    host.querySelectorAll('[data-reveal]').forEach(b =>
      b.addEventListener('click', () => CB.toast('Keys are never shown twice — rotate instead')))
    document.getElementById('btn-new-key')?.addEventListener('click', () => CB.toast('Key creation is not wired in this prototype'))
    host.querySelectorAll('[data-toggle]').forEach(b => b.addEventListener('click', () => {
      const sched = D.export.schedules.find(s => s.id === b.dataset.toggle)
      sched.enabled = !sched.enabled
      CB.toast('Prototype: schedule state is not persisted')
      renderBody()
    }))
  }

  renderNav()
  renderBody()
})()
</script>
</body>
</html>
